name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle 8.0 (Versão Compatível)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0

    - name: Compilar o APK
      run: |
        # Se o script gradlew existir, usa ele. 
        # Se não, usa o comando 'gradle' que agora está forçado na versão 8.0
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: HologramESP-APK
        path: app/build/outputs/apk/debug/app-debug.apk
