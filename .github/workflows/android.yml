name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Baixar e instalar Gradle 8.0 manualmente
      run: |
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip -O gradle.zip
        unzip -q gradle.zip
        echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Gerar Wrapper e Compilar APK
      run: |
        # Gera o script gradlew na versão 8.0
        gradle wrapper --gradle-version 8.0
        # Compila o projeto usando o wrapper gerado
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: HologramESP-APK
        path: app/build/outputs/apk/debug/app-debug.apk
